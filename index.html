<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
  }
  .login-box {
    background: #fff;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    width: 320px;
    text-align: center;
  }
  .login-box h2 {
    margin-bottom: 20px;
    color: #333;
  }
  .login-box input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
  }
  .login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #4facfe;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  .login-box button:hover {
    background: #00c2e0;
  }
  .login-box a {
    display: block;
    margin-top: 12px;
    color: #4facfe;
    text-decoration: none;
    font-size: 13px;
  }
</style>
</head>
<body>

  <div class="login-box">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <input type="email" placeholder="البريد الإلكتروني" required>
      <input type="password" placeholder="كلمة المرور" required>
      <button type="submit">دخول</button>
    </form>
    <a href="#">نسيت كلمة المرور؟</a>
    <a href="signup.html">ليس لديك حساب؟ أنشئ حساباً جديداً</a>
  </div>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC7EGWiuEDEr3B90zeS1CEgr5F3ue7MzSg",
    authDomain: "facbook-dcdec.firebaseapp.com",
    projectId: "facbook-dcdec",
    storageBucket: "facbook-dcdec.firebasestorage.app",
    messagingSenderId: "969873004074",
    appId: "1:969873004074:web:b1d599d90c740c6e759553"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.querySelector('input[type="email"]').value;
    const password = document.querySelector('input[type="password"]').value;

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        window.location.href = "welcome.html";
      })
      .catch((error) => {
        alert("البريد الإلكتروني أو كلمة المرور غير صحيحة");
      });
  });
</script>
</body>
</html>
